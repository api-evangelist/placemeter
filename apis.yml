name: Placemeter
description: >-
  Placemeter was a New York City computer-vision analytics startup (a Techstars
  company) that turned live video feeds into real-time measurements of
  pedestrian and vehicle activity in physical places, offering a data API for
  foot-traffic and movement counts. The standalone product and developer API are
  no longer operational: placemeter.com no longer serves a website (the apex
  domain has no address record, carries no mail exchanger, and is defensively
  parked under Netgear's corporate registrar, CSC Corporate Domains), so there is
  no live API surface, documentation, SDK, or event stream to enrich.
